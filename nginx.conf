# This setup is tuned specifically
# for my RPI5 server
# and my personal preferences
user www-data;
worker_processes 4;
worker_cpu_affinity auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
events {
	worker_connections 1024;
}
http {
	access_log /var/log/nginx/access.log;

	sendfile on;
	gzip on;
	tcp_nopush on;
	types_hash_max_size 2048;
	server_tokens off;

	include /etc/nginx/mine.types;
	default_type application/octet-stream;

	server {
		listen 80;
		return 301 https://plasmatoroid.net/$request_uri
	}
	server {
		listen 443 ssl;
		keepalive_timeout 70;

		root /data/www;
		error_page 404 /404.html
		index index.html index.t
		autoindex on;
		location / {
			try_files $uri $uri/
		}
		location ~ \.tl$ {
			# Don't try to run t on a file that doesn't exist
			try_files $uri =404;
			fastcgi_pass unix:/run/t.sock;
			fastcgi_param SCRIPT_FILENAME $request_filename;
		}
	}
}